<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عملية إنقاذ أوس من وجدي</title>
<style>
:root{--bg:#0b0b14;--fg:#eee;--btn:rgba(40,40,60,.6);--bd:rgba(255,255,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;display:block}
#ctl{direction:ltr;position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.g{display:flex;gap:10px;pointer-events:auto}
body.gamepad-active #ctl{display:none!important}
button{width:62px;height:62px;border-radius:50%;border:2px solid var(--bd);background:var(--btn);color:var(--fg);font-size:22px;touch-action:none;padding:0;line-height:1.05}
/* أزرار الحركة والضرب أكبر وأسهل للمس */
button[data-k="L"],button[data-k="R"],button[data-k="A"],button[data-k="J"]{width:78px;height:78px;font-size:29px}
.g{gap:8px}
button:active{filter:brightness(.7)}
@media (orientation:portrait){button[data-k="L"],button[data-k="R"],button[data-k="A"],button[data-k="J"]{width:68px;height:68px;font-size:26px}.g{gap:6px}}
button small{display:block;font-size:11px;font-weight:700}
#gb{opacity:.45;filter:grayscale(1)}#gb.rdy{opacity:1;filter:none;box-shadow:0 0 0 3px #ff5a1f,0 0 14px #ff5a1f}
#back{position:fixed;z-index:7;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:44px;height:44px;display:none}
@media (orientation:portrait){#c{width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16}}
#menu{position:fixed;inset:0;z-index:5;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#eee;background:radial-gradient(ellipse 70% 40% at 50% 110%,#3a0d1c 0 99%,transparent),linear-gradient(#06060f,#1c1030 70%,#3a1428)}
#menu::before{content:"";position:absolute;top:8%;left:60%;width:70px;height:70px;border-radius:50%;background:#e8e4f4;box-shadow:0 0 40px 10px rgba(232,228,244,.4)}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:min(3vh,14px);padding:12px}
.st[hidden]{display:none}
#logo{height:min(58vh,340px);width:auto;max-width:86vw;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.6)}
@media (orientation:portrait){#logo{height:auto;width:min(80vw,340px)}}
h2{margin:0;font-size:clamp(20px,6.5vh,34px);font-weight:900;color:#ff2a3a;text-shadow:0 3px 0 #300,0 0 18px rgba(255,40,60,.5)}
#go{width:auto;height:auto;border-radius:34px;padding:min(1.6vh,10px) 54px;font-size:clamp(20px,6vh,32px);font-weight:900;background:linear-gradient(#c01828,#7a0c18);color:#fff;border:3px solid #300;box-shadow:0 6px 0 #300,0 10px 18px rgba(0,0,0,.5);animation:pl 1.3s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.06)}}
.row{display:flex;gap:12px;direction:rtl;flex-wrap:wrap;justify-content:center}
.opt{border:3px solid rgba(255,255,255,.25);border-radius:18px;padding:12px 22px;background:rgba(255,255,255,.1);font-weight:900;font-size:clamp(16px,5vh,26px);cursor:pointer;color:#eee;text-align:center}
.opt:active{transform:scale(.96)}
.opt small{display:block;font-size:.6em;font-weight:600;opacity:.8}
.ch{padding:6px 12px}.ch canvas{display:block;margin:0 auto 2px;height:min(26vh,110px);width:auto}
.ch[hidden]{display:none}
</style>
</head>

 let pads=[];try{pads=Array.from(navigator.getGamepads?navigator.getGamepads():[])}catch(e){}
 let pad=activePadIndex!==null?pads[activePadIndex]:null;
 if(!pad||!pad.connected){pad=pads.find(q=>q&&q.connected)||null;activePadIndex=pad?pad.index:null}
 const connected=!!pad;

 const b=pad.buttons||[],a=pad.axes||[];

 }
